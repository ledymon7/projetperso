<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Certia – Experts et professionnels vérifiés près de chez vous</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#ffffff;--sf:#fff;--tx:#14213a;--mu:#5b667a;--bd:#e0e5ee;--ac:#1d4ed8;--al:#e6edff;--ok:#0f8a5f;--okl:#e2f6ee;--wn:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{max-width:100%;overflow-x:clip}body{margin:0;background:var(--bg);color:var(--tx);font:400 clamp(16px,.95rem + .15vw,17px)/1.6 'Plus Jakarta Sans',system-ui,Arial,sans-serif;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
a{color:inherit}h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}h1{font-size:clamp(28px,5vw,44px);font-weight:800}h2{font-size:clamp(20px,2.2vw + 12px,26px);font-weight:800}h3{font-size:17px;font-weight:600}
.w{max-width:1120px;width:100%;margin:0 auto;padding:0 clamp(14px,4vw,28px)}.sec{padding:36px 0}
header{background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;cursor:pointer;color:var(--ac);margin-right:auto}.nav a{cursor:pointer;text-decoration:none;font-weight:500;color:var(--mu)}.nav a:hover{color:var(--tx)}
.btn{display:inline-block;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:9px 16px;border-radius:8px;font:600 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.o{background:transparent;color:var(--ac)}.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}.btn.s{padding:6px 11px;font-size:13px}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px}
.hero{background:#fff;color:var(--tx);padding:48px 0 44px;border-bottom:1px solid var(--bd)}.hero p{max-width:560px;color:var(--mu)}
.sb{display:flex;gap:8px;background:var(--sf);padding:8px;border-radius:12px;margin-top:22px;flex-wrap:wrap;border:1px solid var(--bd);box-shadow:0 2px 10px rgba(20,33,58,.08)}
.sb input{flex:1 1 220px;border:0;background:transparent;color:var(--tx);font:16px inherit;font-family:inherit;padding:12px}.sb input+input{border-left:1px solid var(--bd);flex:0 1 190px}
.sb .btn{padding:12px 24px;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid var(--bd);color:var(--tx);background:transparent;border-radius:20px;padding:5px 12px;font:13px inherit;font-family:inherit;cursor:pointer}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cat{cursor:pointer;display:flex;gap:12px;align-items:flex-start}.cat:hover,.pc:hover{border-color:var(--ac)}.ic{width:44px;height:44px;border-radius:10px;background:var(--al);display:grid;place-items:center;font-size:22px;flex:none}
.pc{display:flex;gap:14px;cursor:pointer;align-items:flex-start}.av{width:56px;height:56px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.mu{color:var(--mu);font-size:13px}.bdg{display:inline-block;background:var(--okl);color:var(--ok);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}.bdg.n{background:var(--al);color:var(--mu)}
.pr{font-weight:800;font-size:17px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.two{display:grid;gap:18px;grid-template-columns:1fr}@media(min-width:820px){.two{grid-template-columns:260px 1fr}.two.r{grid-template-columns:1fr 340px}}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:15px inherit;font-family:inherit}
.tabs{display:flex;gap:6px;margin:12px 0}.tab{padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;font:600 13px inherit;font-family:inherit;color:var(--tx)}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stat{font-size:26px;font-weight:800}.note{background:var(--al);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--tx)}
.tb{width:100%;border-collapse:collapse}.tb td,.tb th{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
footer{border-top:1px solid var(--bd);background:var(--sf);padding:28px 0;margin-top:30px;color:var(--mu);font-size:13px}
.tx{max-width:70ch}.stp{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12px;text-align:center}.cal div{padding:8px 2px;border-radius:6px;background:var(--bg)}.cal .b{background:var(--al)}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
/* ===== Responsive : grand écran, tablette, mobile ===== */
img,svg,video{max-width:100%;height:auto}.card,.pc>div,.cat>div,.row>*{min-width:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.bg{display:none;width:44px;height:44px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font-size:20px;line-height:1;cursor:pointer;align-items:center;justify-content:center}
.mn{display:flex;align-items:center;gap:16px;flex-wrap:wrap}#ua{display:inline-flex;align-items:center;gap:16px}
@media(min-width:821px) and (max-width:1024px){.two{grid-template-columns:230px 1fr}.two.r{grid-template-columns:1fr 300px}.hero{padding-top:40px}}
@media(max-width:820px){
.nav{flex-wrap:nowrap;position:relative}.bg{display:inline-flex}
.mn{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:0 12px 24px rgba(20,33,58,.1);padding:6px clamp(14px,4vw,28px) 16px;max-height:calc(100vh - 64px);overflow-y:auto}
.mn.open{display:flex}.mn>a,#ua a{padding:14px 2px;border-bottom:1px solid var(--bd);font-size:16px;color:var(--tx)}
#ua{display:flex;flex-direction:column;gap:0}#ua .btn{margin-top:12px;border:1px solid var(--ac);border-radius:8px;text-align:center;padding:13px;color:#fff!important}
}
/* ===== Optimisation téléphone uniquement (≤ 700 px) : le rendu PC n’est pas modifié ===== */
@media(max-width:700px){
body{overflow-x:hidden}
.w{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.sec{padding:22px 0}h2{font-size:20px}.stat{font-size:22px}
.nav{min-height:56px}.logo{font-size:20px}h1[style]{font-size:clamp(22px,6.5vw,30px)!important}.mu{font-size:14px}.bdg{font-size:13px}


.hero{padding:26px 0 24px}.hero h1{font-size:25px}.hero h1 br{display:none}
.sb{flex-direction:column;gap:0;padding:6px}.sb input,.sb input+input{flex:1 1 auto;width:100%;border-left:0}.sb input+input{border-top:1px solid var(--bd)}.sb .btn{width:100%;padding:13px}.sb form{flex-direction:column;align-items:stretch}
.chips{flex-wrap:nowrap;overflow-x:auto;margin-right:-14px;padding-bottom:4px;-webkit-overflow-scrolling:touch}.chip{white-space:nowrap;flex:none;padding:8px 14px}
input,select,textarea{min-height:44px;font-size:16px}input[type=checkbox]{min-height:0;width:22px!important;height:22px}input[type=range]{padding:0}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center}.btn.s{min-height:40px}.tab{padding:10px 14px}.tabs{flex-wrap:wrap}
.grid,.grid[style]{grid-template-columns:1fr!important}
.card{padding:14px}.pc{gap:12px}.av{width:48px;height:48px}
.two,.two.r{gap:14px}aside .card,.two>aside{position:static!important}.two>aside label{margin:8px 0 3px}
.tb td,.tb th{padding:9px 4px;font-size:13px}.tb td .btn,.tb td button{white-space:nowrap}
.card.row.sp .btn{width:100%}
.cal{gap:4px;font-size:11px}
footer .row{flex-direction:column;align-items:flex-start;gap:6px}
}
</style></head><body>
<header><div class="w nav"><span class="logo" onclick="go('home')" tabindex="0">certia</span><button id="bg" class="bg" type="button" aria-label="Ouvrir le menu" aria-controls="mn" aria-expanded="false" onclick="tg()">☰</button><nav id="mn" class="mn" aria-label="Navigation principale">
<a onclick="go('categories')">Catégories</a><a onclick="go('about')">Comment ça marche</a><a onclick="S.t='pro';go('signup')">Devenir professionnel</a><a onclick="go('contact')">Aide</a><span id="ua"></span></nav></div></header>
<main id="app"></main>
<footer><div class="w row sp"><span>© 2026 Certia – Prototype de démonstration. Professionnels, avis et paiements fictifs : aucune transaction ni vérification réelle n’est effectuée.</span><span class="row"><a href="#about">À propos</a><a href="#contact">Contact</a></span></div></footer>
<script>
const C=[['auto','Automobile','🚗','Inspection, diagnostic et expertise avant achat ou vente'],['immo','Immobilier','🏠','Estimation, inspection et diagnostic de logement'],['info','Informatique','💻','Réparation d’ordinateurs et de téléphones, données'],['bat','Travaux et bâtiment','🛠️','Électricité, plomberie, rénovation, expertise'],['elec','Électroménager','🔌','Réparation, diagnostic et vérification d’appareils'],['fin','Finance et comptabilité','📊','Comptables et conseillers financiers qualifiés'],['jur','Juridique','⚖️','Consultation et accompagnement par des juristes'],['autres','Autres services','✨','De nouveaux domaines ajoutés régulièrement']];
const P=[['Garage Expert Lemaire','auto','Expert automobile','Cergy','95000',4.9,128,3,1,1,[['Inspection avant achat',89],['Diagnostic mécanique',59],['Contrôle carrosserie',49]]],
['Karim Benali Expertise','auto','Expert automobile','Paris','75015',4.7,86,24,0,1,[['Expertise avant vente',79],['Inspection avant achat',99]]],
['Diagnostic Habitat 95','immo','Diagnostiqueur immobilier','Pontoise','95300',4.8,203,6,1,1,[['Diagnostic complet logement',149],['Inspection avant achat',190]]],
['Sophie Marchand','immo','Estimatrice immobilière','Paris','75011',4.6,52,22,1,0,[['Estimation de bien',120],['Avis de valeur écrit',180]]],
['Dépann’Info 95','info','Dépannage informatique','Cergy','95800',4.8,311,2,1,1,[['Dépannage à domicile',45],['Récupération de données',90],['Réparation de téléphone',49]]],
['Lucas Réparation PC','info','Réparation d’ordinateurs','Paris','75010',4.5,74,25,1,0,[['Diagnostic ordinateur',25],['Réparation ordinateur',65]]],
['Électricité Moreau','bat','Électricien','Paris','75012',4.7,142,23,0,1,[['Mise aux normes tableau',180],['Dépannage électrique',70]]],
['Plomberie Durand','bat','Plombier','Argenteuil','95100',4.4,97,12,1,1,[['Recherche de fuite',85],['Dépannage plomberie',75]]],
['ElectroRépar Services','elec','Réparateur électroménager','Eaubonne','95600',4.6,66,10,1,0,[['Diagnostic appareil',39],['Réparation lave-linge',89]]],
['Cabinet Perrin Comptabilité','fin','Expert-comptable','Paris','75008',4.9,58,26,1,1,[['Rendez-vous conseil 1 h',90],['Bilan simplifié',350]]],
['Me Claire Fontaine','jur','Avocate','Versailles','78000',4.8,41,30,0,1,[['Consultation juridique 30 min',60],['Relecture de contrat',150]]],
['Paysages Roussel','autres','Paysagiste','Osny','95520',4.5,29,5,1,0,[['Conseil jardin',55],['Devis aménagement',0]]]]
.map((p,i)=>({id:i+1,n:p[0],c:p[1],sp:p[2],v:p[3],cp:p[4],r:p[5],rv:p[6],d:p[7],av:p[8],ok:p[9],s:p[10],pr:Math.min(...p[10].map(x=>x[1]||999))}));
const COL=['#1d4ed8','#0f766e','#7c3aed','#be185d','#b45309','#334155'];
const S={user:null,t:'part',f:{q:'',city:'',pmax:400,rmin:0,dmax:50,av:false,cat:''},svc:0,bk:[{id:'CR-2041',p:5,s:'Dépannage à domicile',pr:45,dt:'12/11/2026',st:'Terminée',rep:0,rv:0},{id:'CR-2055',p:1,s:'Inspection avant achat',pr:89,dt:'03/11/2026',st:'Terminée',rep:1,rv:0}],rq:[['Camille R.','Inspection avant achat','28/11 · 10h',0],['Julien P.','Diagnostic mécanique','30/11 · 14h',0],['Nadia B.','Contrôle carrosserie','02/12 · 9h',0]]};
const $=s=>document.querySelector(s),go=h=>{location.hash=h},cat=k=>C.find(c=>c[0]==k),pro=i=>P.find(p=>p.id==i),eur=n=>n.toLocaleString('fr-FR')+' €',av=p=>`<div class="av" style="background:${COL[p.id%6]}">${p.n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>`,stars=p=>`★ ${p.r.toString().replace('.',',')} <span class="mu">(${p.rv} avis)</span>`;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function card(p){return `<div class="card pc" onclick="go('pro-${p.id}')">${av(p)}<div style="flex:1"><div class="row sp"><h3>${p.n}</h3>${p.ok?'<span class="bdg">✓ Professionnel vérifié</span>':''}</div><div class="mu">${p.sp} · ${cat(p.c)[1]}</div><div class="mu">📍 ${p.v} (${p.cp}) · à ${p.d} km · ${p.av?'Disponible cette semaine':'Sur rendez-vous'}</div><div class="row sp" style="margin-top:8px"><span>${stars(p)}</span><span class="pr">dès ${eur(p.pr)}</span></div><span class="btn s o" style="margin-top:8px">Voir le profil</span></div></div>`}
function hits(){const f=S.f,q=norm(f.q),ci=norm(f.city);return P.filter(p=>{const hay=norm([p.n,p.sp,cat(p.c)[1],...p.s.map(x=>x[0])].join(' '));const words=q.replace(/pres de chez moi|a paris|pour|un|une|de|le|la|des|du/g,' ').split(/\s+/).filter(w=>w.length>2);return(!words.length||words.some(w=>hay.includes(w.replace(/s$/,''))))&&(!ci||norm(p.v).includes(ci)||p.cp.startsWith(ci))&&(!f.cat||p.c==f.cat)&&p.pr<=f.pmax&&p.r>=f.rmin&&p.d<=f.dmax&&(!f.av||p.av)}).sort((a,b)=>b.r-a.r)}
function ua(){$('#ua').innerHTML=S.user?`<a onclick="go('dash-${S.user}')">Mon espace</a> <a onclick="S.user=null;ua();go('home')">Déconnexion</a>`:`<a onclick="go('login')">Connexion</a> <a class="btn s" onclick="S.t='part';go('signup')" style="color:#fff">S’inscrire</a>`}
function doSearch(e){e&&e.preventDefault();S.f.q=$('#q').value;S.f.city=$('#ci').value;S.f.cat='';go('search');if(location.hash=='#search')R()}
function sbar(){return `<form class="sb" onsubmit="doSearch(event)"><input id="q" placeholder="Expert automobile, électricien, diagnostic…" aria-label="Que recherchez-vous ?" value="${S.f.q}"><input id="ci" placeholder="Ville ou code postal" aria-label="Localisation" value="${S.f.city}"><button class="btn">Rechercher</button></form>`}
const V={
home(){return `<section class="hero"><div class="w"><h1>Trouvez un expert de confiance,<br>réservez et payez en ligne.</h1><p>Inspection de véhicule, diagnostic immobilier, dépannage informatique, travaux : comparez des professionnels vérifiés, leurs tarifs et leurs avis.</p>${sbar()}<div class="chips">${['Expert automobile','Diagnostic voiture','Réparation ordinateur','Expert immobilier','Électricien'].map(x=>`<button class="chip" onclick="S.f.q='${x}';S.f.city='';go('search')">${x}</button>`).join('')}</div></div></section>
<div class="w"><div class="sec"><div class="row sp"><h2>Parcourir par catégorie</h2><a href="#categories" class="mu">Toutes les catégories</a></div><div class="grid" style="margin-top:14px">${C.map(c=>`<div class="card cat" onclick="go('cat-${c[0]}')"><div class="ic">${c[2]}</div><div><h3>${c[1]}</h3><div class="mu">${c[3]}</div></div></div>`).join('')}</div></div>
<div class="sec"><h2>Comment ça marche</h2><div class="stp" style="margin-top:14px"><div class="card"><h3>1. Cherchez</h3><p class="mu">Un service, un métier ou une ville. Filtrez par prix, distance, note et disponibilité.</p></div><div class="card"><h3>2. Comparez</h3><p class="mu">Profils détaillés, qualifications, tarifs affichés et avis de clients ayant réservé.</p></div><div class="card"><h3>3. Réservez et payez</h3><p class="mu">Choisissez un créneau, payez sur le site. Le professionnel est rémunéré après la prestation.</p></div><div class="card"><h3>4. Recevez votre rapport</h3><p class="mu">Pour les expertises, un rapport en ligne à partager, par exemple dans une annonce de vente.</p></div></div></div>
<div class="sec"><div class="row sp"><h2>Professionnels les mieux notés</h2></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr));margin-top:14px">${[...P].sort((a,b)=>b.r-a.r).slice(0,4).map(card).join('')}</div></div>
<div class="sec"><div class="card row sp" style="padding:26px"><div><h2>Vous êtes professionnel ?</h2><p class="mu tx">Recevez des demandes qualifiées, gérez votre agenda et vos revenus au même endroit. Inscription gratuite, commission de 15 % uniquement sur les prestations réalisées.</p></div><button class="btn" onclick="S.t='pro';go('signup')">Créer mon compte professionnel</button></div></div></div>`},
categories(){return `<div class="w sec"><h1 style="font-size:30px">Toutes les catégories</h1><div class="grid" style="margin-top:18px">${C.map(c=>`<div class="card cat" onclick="go('cat-${c[0]}')"><div class="ic">${c[2]}</div><div><h3>${c[1]}</h3><div class="mu">${c[3]}</div><div class="mu">${P.filter(p=>p.c==c[0]).length} professionnel(s)</div></div></div>`).join('')}</div></div>`},
cat(k){const c=cat(k),l=P.filter(p=>p.c==k),sv=[...new Set(l.flatMap(p=>p.s.map(s=>s[0])))];return `<div class="w sec"><div class="mu"><a href="#categories">Catégories</a> › ${c[1]}</div><div class="row" style="margin:10px 0"><div class="ic">${c[2]}</div><h1 style="font-size:30px">${c[1]}</h1></div><p class="mu tx">${c[3]}.</p><h3 style="margin:20px 0 8px">Prestations courantes</h3><div class="row">${sv.map(s=>`<button class="tab" onclick="S.f.q='${s.replace(/'/g,'’')}';S.f.cat='${k}';go('search')">${s}</button>`).join('')}</div><h3 style="margin:22px 0 10px">Professionnels</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${l.map(card).join('')}</div>${k=='autres'?'<p class="note" style="margin-top:16px">Cette catégorie accueille progressivement de nouveaux domaines. Une idée de service ? Écrivez-nous depuis la page Aide.</p>':''}</div>`},
search(){const f=S.f;setTimeout(()=>{upd()},0);return `<div class="w sec"><div class="sb" style="box-shadow:none;border:1px solid var(--bd);margin:0 0 18px">${sbar().replace(/^<form class="sb"/,'<form class="row" style="flex:1"')}</div><div class="two"><aside class="card"><h3>Filtres</h3><label>Spécialité</label><select id="fc" onchange="upd(1)"><option value="">Toutes</option>${C.map(c=>`<option value="${c[0]}" ${f.cat==c[0]?'selected':''}>${c[1]}</option>`).join('')}</select><label>Prix de départ max : <b id="lp">${f.pmax} €</b></label><input id="fp" type="range" min="20" max="400" step="10" value="${f.pmax}" oninput="upd(1)"><label>Distance max : <b id="ld">${f.dmax} km</b></label><input id="fd" type="range" min="2" max="50" value="${f.dmax}" oninput="upd(1)"><label>Note minimale</label><select id="fr" onchange="upd(1)">${[0,4,4.5,4.8].map(n=>`<option ${f.rmin==n?'selected':''} value="${n}">${n?n+' et plus':'Toutes'}</option>`).join('')}</select><label><input id="fa" type="checkbox" style="width:auto" ${f.av?'checked':''} onchange="upd(1)"> Disponible cette semaine</label></aside><div><div id="cnt" class="mu" style="margin-bottom:10px"></div><div id="res" class="grid" style="grid-template-columns:1fr"></div></div></div></div>`},
pro(i){const p=pro(i);return `<div class="w sec"><div class="mu"><a href="#cat-${p.c}">${cat(p.c)[1]}</a> › ${p.n}</div><div class="two r" style="margin-top:12px"><div><div class="card row" style="align-items:flex-start">${av(p)}<div><h1 style="font-size:26px">${p.n}</h1><div class="mu">${p.sp} · 📍 ${p.v} (${p.cp}) · intervient dans un rayon de ${Math.max(p.d,15)} km</div><div style="margin:6px 0">${stars(p)}</div>${p.ok?'<span class="bdg">✓ Professionnel vérifié</span> <span class="mu">(démo)</span>':'<span class="bdg n">Vérification en cours</span>'}</div></div>
<div class="card" style="margin-top:14px"><h3>Présentation</h3><p class="mu tx">${p.sp} basé à ${p.v}. Interventions sur rendez-vous, compte rendu détaillé à l’issue de chaque mission. Qualifications et assurance professionnelle renseignées sur le profil.</p></div>
<div class="card" style="margin-top:14px"><h3>Prestations et tarifs</h3><table class="tb">${p.s.map((s,k)=>`<tr><td>${s[0]}</td><td class="pr">${s[1]?eur(s[1]):'Sur devis'}</td><td><button class="btn s" onclick="S.svc=${k};go('book-${p.id}')">Réserver</button></td></tr>`).join('')}</table></div>
<div class="card" style="margin-top:14px"><h3>Avis récents</h3>${[['Marie L.','Rapport clair, intervention ponctuelle. Je recommande.'],['Thomas D.','Prix annoncé respecté, très pédagogue.'],['Aïcha K.','Rapide et sérieux.']].map(a=>`<p><b>${a[0]}</b> ★★★★★<br><span class="mu">${a[1]}</span></p>`).join('')}<p class="mu">Avis fictifs de démonstration.</p></div></div>
<aside><div class="card" style="position:sticky;top:80px"><div class="mu">À partir de</div><div class="stat">${eur(p.pr)}</div><p class="mu">Prix affiché tout compris. Le paiement est sécurisé et libéré après la prestation.</p><button class="btn" style="width:100%" onclick="S.svc=0;go('book-${p.id}')">Réserver</button><p class="note" style="margin-top:12px">Exemple pour 100 € : <b>85 €</b> pour le professionnel, <b>15 €</b> de commission Certia.</p></div></aside></div></div>`},
book(i){const p=pro(i),s=p.s[S.svc]||p.s[0];return `<div class="w sec"><h1 style="font-size:28px">Réserver avec ${p.n}</h1><div class="two r" style="margin-top:14px"><form class="card" onsubmit="event.preventDefault();S.b={p:${p.id},s:$('#bs').value,pr:+$('#bs').selectedOptions[0].dataset.p,dt:$('#bd').value,tm:$('#bt').value};S.user?go('pay'):(S.next='pay',go('login'))"><label>Prestation</label><select id="bs">${p.s.map((x,k)=>`<option data-p="${x[1]}" ${k==S.svc?'selected':''}>${x[0]}</option>`).join('')}</select><label>Date souhaitée</label><input id="bd" type="date" required><label>Créneau</label><select id="bt"><option>9h – 11h</option><option>11h – 13h</option><option>14h – 16h</option><option>16h – 18h</option></select><label>Adresse d’intervention</label><input required placeholder="Numéro, rue, ville"><label>Précisions</label><textarea rows="3" placeholder="Modèle, état, informations utiles…"></textarea><p><button class="btn">Continuer vers le paiement</button></p></form><aside class="card"><h3>${p.n}</h3><div class="mu">${p.sp} · ${p.v}</div><p>${stars(p)}</p><p class="note">Annulation gratuite jusqu’à 24 h avant. Prix annoncé : ${s[1]?eur(s[1]):'sur devis'}.</p></aside></div></div>`},
pay(){const b=S.b;if(!b)return go('home');const p=pro(b.p),fee=Math.round(b.pr*.15*100)/100;return `<div class="w sec"><h1 style="font-size:28px">Paiement</h1><div class="two r" style="margin-top:14px"><form class="card" onsubmit="event.preventDefault();S.bk.unshift({id:'CR-'+(2060+S.bk.length),p:b.p,s:b.s,pr:b.pr,dt:b.dt.split('-').reverse().join('/'),st:'Confirmée',rep:0,rv:0});S.b=null;go('dash-part')"><p class="note"><b>Simulation :</b> aucun paiement réel n’est effectué, ne saisissez pas de vraie carte.</p><label>Titulaire</label><input required placeholder="Prénom Nom"><label>Numéro de carte</label><input required inputmode="numeric" placeholder="4242 4242 4242 4242"><div class="row"><div style="flex:1"><label>Expiration</label><input required placeholder="MM/AA"></div><div style="flex:1"><label>CVC</label><input required placeholder="123"></div></div><p><button class="btn g">Payer ${eur(b.pr)} (simulation)</button></p></form><aside class="card"><h3>Récapitulatif</h3><p>${b.s}<br><span class="mu">${p.n} · ${b.dt.split('-').reverse().join('/')} · ${b.tm}</span></p><table class="tb"><tr><td>Prestation</td><td>${eur(b.pr)}</td></tr><tr><td class="mu">dont rémunération du professionnel (85 %)</td><td class="mu">${eur(b.pr-fee)}</td></tr><tr><td class="mu">dont commission Certia (15 %)</td><td class="mu">${eur(fee)}</td></tr><tr><td><b>Total</b></td><td class="pr">${eur(b.pr)}</td></tr></table></aside></div></div>`},
login(){return `<div class="w sec" style="max-width:440px"><h1 style="font-size:28px">Connexion</h1><div class="tabs"><button class="tab ${S.t=='part'?'on':''}" onclick="S.t='part';R()">Particulier</button><button class="tab ${S.t=='pro'?'on':''}" onclick="S.t='pro';R()">Professionnel</button></div><form class="card" onsubmit="event.preventDefault();S.user=S.t;ua();let n=S.next;S.next=0;go(n&&S.t=='part'?n:'dash-'+S.t)"><label>Adresse e-mail</label><input type="email" required><label>Mot de passe</label><input type="password" required><p><button class="btn" style="width:100%">Se connecter</button></p><p class="mu">Pas encore de compte ? <a href="#signup">Créer un compte</a></p></form></div>`},
signup(){const pr=S.t=='pro';return `<div class="w sec"><div class="tabs"><button class="tab ${!pr?'on':''}" onclick="S.t='part';R()">Je suis particulier</button><button class="tab ${pr?'on':''}" onclick="S.t='pro';R()">Je suis professionnel</button></div><div class="two r"><div><h1 style="font-size:30px">${pr?'Développez votre activité avec Certia':'Créer mon compte'}</h1>${pr?`<p class="mu tx">Présentez votre savoir-faire, fixez vos tarifs et votre zone d’intervention, puis recevez des demandes de clients prêts à réserver.</p><div class="stp" style="margin:16px 0">${[['Inscription gratuite','Aucun abonnement, commission de 15 % sur les missions réalisées.'],['Vous gardez la main','Vous acceptez ou refusez chaque mission, votre agenda reste le vôtre.'],['Profil vérifié','Le badge est attribué après contrôle de vos justificatifs.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div>`:'<p class="mu">Un compte gratuit pour réserver, payer et suivre vos prestations.</p>'}</div>
<form class="card" onsubmit="event.preventDefault();S.user=S.t;ua();go('dash-'+S.t)"><label>${pr?'Nom de l’entreprise':'Nom complet'}</label><input required>${pr?`<label>Domaine d’activité</label><select>${C.map(c=>`<option>${c[1]}</option>`).join('')}</select><label>N° SIRET</label><input required inputmode="numeric" placeholder="14 chiffres"><label>Ville d’intervention</label><input required>`:''}<label>E-mail</label><input type="email" required><label>Mot de passe</label><input type="password" required minlength="8"><p><button class="btn" style="width:100%">${pr?'Créer mon compte professionnel':'Créer mon compte'}</button></p>${pr?'<p class="mu">Le badge « Professionnel vérifié » n’est attribué qu’après vérification effective des justificatifs.</p>':''}</form></div></div>`},
'dash-part'(){return `<div class="w sec"><h1 style="font-size:28px">Mon espace</h1><div class="mu">Réservations, factures et rapports</div><div class="card" style="margin-top:16px"><h3>Mes réservations</h3><div style="overflow-x:auto"><table class="tb"><tr><th>N°</th><th>Prestation</th><th>Date</th><th>Statut</th><th>Prix</th><th></th></tr>${S.bk.map((b,k)=>`<tr><td>${b.id}</td><td>${b.s}<div class="mu">${pro(b.p).n}</div></td><td>${b.dt}</td><td><span class="bdg ${b.st=='Terminée'?'':'n'}">${b.st}</span></td><td>${eur(b.pr)}</td><td class="row"><button class="btn s o" onclick="alert('Facture ${b.id} (simulation)')">Facture</button>${b.rep?`<a class="btn s o" href="#report">Rapport</a>`:''}${b.st=='Terminée'&&!b.rv?`<button class="btn s" onclick="S.bk[${k}].rv=1;R()">Laisser un avis</button>`:''}${b.rv?'<span class="mu">Avis envoyé ✓</span>':''}</td></tr>`).join('')}</table></div></div><p><button class="btn" onclick="go('search')">Rechercher un professionnel</button></p></div>`},
'dash-pro'(){return `<div class="w sec"><h1 style="font-size:28px">Espace professionnel</h1><div class="mu">Garage Expert Lemaire (démo)</div><div class="grid" style="margin:16px 0">${[['Revenus du mois',eur(1241.5)],['Missions réalisées','14'],['Note moyenne','4,9 / 5']].map(x=>`<div class="card"><div class="mu">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}<div class="card"><div class="mu">Calcul des revenus</div>Brut 1 460 €<br>Commission 15 % : −218,50 €<br><b>Net : 1 241,50 €</b></div></div><div class="two r"><div class="card"><h3>Demandes reçues</h3><table class="tb">${S.rq.map((r,k)=>`<tr><td><b>${r[0]}</b><div class="mu">${r[1]} · ${r[2]}</div></td><td class="row">${r[3]?`<span class="bdg ${r[3]==1?'':'n'}">${r[3]==1?'Acceptée':'Refusée'}</span>`:`<button class="btn s g" onclick="S.rq[${k}][3]=1;R()">Accepter</button><button class="btn s o" onclick="S.rq[${k}][3]=2;R()">Refuser</button>`}</td></tr>`).join('')}</table></div><div class="card"><h3>Calendrier de la semaine</h3><div class="cal">${['Lun','Mar','Mer','Jeu','Ven'].map((d,k)=>`<div class="${k%2?'':'b'}">${d}<br>${k%2?'Libre':'2 missions'}</div>`).join('')}</div><h3 style="margin-top:18px">Mon profil</h3><p class="mu">Spécialités, qualifications, tarifs et zone d’intervention : <a href="#pro-1">voir ma page publique</a>.</p></div></div></div>`},
about(){return `<div class="w sec"><h1 style="font-size:30px">Une plateforme qui rassure les deux côtés</h1><p class="mu tx">Certia met en relation des particuliers et des professionnels vérifiés. Vous comparez, réservez et payez en ligne ; le professionnel intervient et peut remettre un rapport consultable en ligne.</p><div class="stp" style="margin-top:18px">${[['Tarifs transparents','Le prix est affiché avant la réservation, sans frais cachés.'],['Vérifications','Le badge ne s’affiche que lorsque les justificatifs ont été contrôlés.'],['Avis authentiques','Seuls les clients ayant réservé peuvent laisser un avis.'],['Paiement sécurisé','Les fonds sont libérés après la prestation.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div><div class="card" style="margin-top:18px"><h3>Modèle économique</h3><p class="mu">Sur chaque prestation réalisée, Certia prélève 15 % de commission. Pour 100 € payés : 85 € pour le professionnel, 15 € pour la plateforme.</p></div></div>`},
contact(){return `<div class="w sec" style="max-width:600px"><h1 style="font-size:28px">Contact et assistance</h1><form class="card" style="margin-top:14px" onsubmit="event.preventDefault();this.innerHTML='<h3>Message envoyé (simulation)</h3><p class=mu>Notre équipe répond sous 24 h ouvrées.</p>'"><label>Sujet</label><select><option>Question sur une réservation</option><option>Je suis professionnel</option><option>Signaler un problème</option><option>Proposer un nouveau service</option></select><label>E-mail</label><input type="email" required><label>Message</label><textarea rows="5" required></textarea><p><button class="btn">Envoyer</button></p></form></div>`},
report(){return `<div class="w sec" style="max-width:760px"><div class="mu"><a href="#dash-part">Mon espace</a> › Rapport</div><h1 style="font-size:28px;margin:8px 0">Rapport d’inspection n° CR-2055</h1><div class="card"><div class="row sp"><div><b>Citroën C3 · 2018 · 74 200 km</b><div class="mu">Garage Expert Lemaire · 03/11/2026</div></div><span class="bdg">Rapport émis via Certia (démo)</span></div><table class="tb" style="margin-top:12px">${[['Moteur','Conforme'],['Freinage','Plaquettes à surveiller (≈ 30 %)'],['Carrosserie','Rayures légères, porte droite'],['Pneumatiques','Usure normale'],['Électronique','Aucun code défaut']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table><p class="note">Avis global : véhicule en bon état général, aucun point bloquant. Document fictif pour la démonstration.</p><button class="btn o" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);this.textContent='Lien copié ✓'">Copier le lien à joindre à mon annonce</button></div></div>`}};
function upd(m){const f=S.f;if(m){f.cat=$('#fc').value;f.pmax=+$('#fp').value;f.dmax=+$('#fd').value;f.rmin=+$('#fr').value;f.av=$('#fa').checked;$('#lp').textContent=f.pmax+' €';$('#ld').textContent=f.dmax+' km'}const l=hits();$('#cnt').textContent=l.length+' professionnel(s) trouvé(s)';$('#res').innerHTML=l.length?l.map(card).join(''):'<div class="card">Aucun résultat. Élargissez la distance, le prix ou la ville.</div>'}
function R(){const h=location.hash.slice(1)||'home',[a,b]=[h.split('-')[0],h.split('-')[1]];let k=h,arg;if(['cat','pro','book'].includes(a)&&b){k=a;arg=b}else if(a=='cat'||a=='pro'||a=='book')k='home';if(!V[k])k='home';if(k=='dash-part'||k=='dash-pro'){if(!S.user){S.next=0;k='login'}else if('dash-'+S.user!=k)k='dash-'+S.user}if((k=='cat'&&!cat(arg))||(['pro','book'].includes(k)&&!pro(arg)))k='home';$('#app').innerHTML=V[k](arg);scrollTo(0,0);ua();tg(false)}
function tg(f){const m=$('#mn'),o=f===undefined?!m.classList.contains('open'):f;m.classList.toggle('open',o);$('#bg').setAttribute('aria-expanded',o);$('#bg').setAttribute('aria-label',o?'Fermer le menu':'Ouvrir le menu');$('#bg').textContent=o?'✕':'☰'}
$('#mn').addEventListener('click',()=>tg(false));addEventListener('keydown',e=>{if(e.key=='Escape')tg(false)});
addEventListener('hashchange',R);R();
</script></body></html>
